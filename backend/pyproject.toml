[project]
name = "career-platform-mvp-backend"
version = "0.1.0"
description = "Career Platform MVP backend API (FastAPI + PostgreSQL)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.2.0",
    "faiss-cpu>=1.16.0",
    "fastapi[standard]>=0.129.0",
    "numpy>=2.5.5",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]
# Autogenerated migrations keep Alembic's template style, not ours.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modern syntax)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "B008", # function calls in argument defaults (FastAPI Depends/Query pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.coverage.run]
source = ["app"]
omit = ["app/*/__init__.py"]
